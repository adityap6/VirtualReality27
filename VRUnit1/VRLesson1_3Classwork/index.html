<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- Task 1: Using the color attribute make the following tree look better -->
      <a-sphere position="0 4 -5" radius="1.25" color="GREEN"></a-sphere>
      <a-sphere position="-1 3 -5" radius="1.25" color="GREEN"></a-sphere>
      <a-sphere position="1 3 -5" radius="1.25" color="GREEN"></a-sphere>
      <a-cylinder position="0 0.75 -5" radius="0.5" height="3.5" COLOR="BROWN" side="double"></a-cylinder>

     <!-- Task 2: Using one of the texture images make the plane look like the ground.  Don't forget to repeat the image if it looks blurred. -->

      <a-plane position="0 0 -1" rotation="-90 0 0" width="20" height="20" src="texture_sand.jpeg" repeat="10 10"></a-plane>
      <a-sky src="sky2.jpeg" repeat="1 1"</a-sky>

      <!-- Task 3: Using either the sky or bk images, change the sky component -->

    </a-scene>
  </body>
</html>
